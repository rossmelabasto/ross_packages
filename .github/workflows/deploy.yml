name: Deploy

# Publishes repo.rossmel.com: the website and the signed package repositories.
#   [ross]  every program in programs.json, from its newest GitHub release, signed here
#   [ros]   the rOS packages, already signed, from the x86_64 release of this repo (not advertised)
# Binaries are never committed: every deploy downloads them again.
#
# Runs when this repo changes (a program's release pushes its version to sources/, the rOS
# publish script runs it by hand) and once a day as a fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch every program's newest release
        run: |
          set -euo pipefail
          mkdir -p _site packages
          jq -c '.[]' programs.json | while read -r p; do
            name=$(jq -r .name <<<"$p") repo=$(jq -r .repo <<<"$p")
            tag=$(gh release list -R "$repo" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "$tag" ]; then echo "$name: no release yet, skipped"; continue; fi
            echo "$name: $tag"
            mkdir -p "fetched/$name"
            echo "$tag" > "fetched/$name/version"
            gh release view "$tag" -R "$repo" --json publishedAt --jq .publishedAt > "fetched/$name/date"
            for f in CHANGELOG.md CHANGELOG.es.md; do
              gh api "repos/$repo/contents/$f?ref=$tag" -H 'Accept: application/vnd.github.raw' > "fetched/$name/$f" 2>/dev/null || rm -f "fetched/$name/$f"
            done
            gh release download "$tag" -R "$repo" --dir packages --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst' \
              || echo "::warning::$name $tag has no packages"
          done
          ls -la packages
          # The compatibility check of ross_visualizer.
          tag=$(cat fetched/ross-visualizer/version)
          gh api "repos/rossmelabasto/ross_visualizer/contents/scripts/check.sh?ref=$tag" -H 'Accept: application/vnd.github.raw' > _site/check.sh

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils rpm createrepo-c

      - name: Build the signed [ross] repositories
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            # Until the key is here, serve the repositories ross_visualizer's release signed.
            echo "::warning::No PACKAGE_SIGNING_KEY: serving ross_visualizer's own repositories"
            tag=$(cat fetched/ross-visualizer/version)
            gh release download "$tag" -R rossmelabasto/ross_visualizer --pattern ross-visualizer-repos.tar.gz --output repos.tar.gz
            tar xzf repos.tar.gz -C _site
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          export SIGNING_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          bash scripts/repos.sh packages repos
          cp -r repos/. _site/
          rm -rf "$GNUPGHOME"

      - name: Fetch the rOS packages
        run: |
          set -euo pipefail
          mkdir -p _site/x86_64 fetched/ros
          gh release download x86_64 -R "$GITHUB_REPOSITORY" --dir _site/x86_64
          mv _site/x86_64/ros.gpg _site/ros.gpg
          ls _site/x86_64 | while read -r f; do : > "fetched/ros/$f"; done

      - run: node build.mjs _site

      - name: Check what pacman, apt and dnf will ask for
        run: |
          set -euo pipefail
          for f in key.asc arch/x86_64/ross.db arch/x86_64/ross.db.sig apt/dists/stable/InRelease rpm/ross.repo rpm/repodata/repomd.xml x86_64/ros.db ros.gpg check.sh; do
            test -s "_site/$f" || { echo "::error::missing $f"; exit 1; }
          done
          tar -tzf _site/arch/x86_64/ross.db | grep '/$'
          grep '^Package:' _site/apt/dists/stable/main/binary-amd64/Packages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
